<title>Sarah en Lennert — Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eee8dd}
body{font-family:Montserrat,Arial,sans-serif;color:#655b50;display:flex;align-items:center;justify-content:center;padding:28px}
.card{
 width:min(920px,100%); min-height:min(900px,calc(100vh - 56px));
 background:#f7f2e9; border:1px solid #a99d8d; border-radius:24px;
 padding:clamp(34px,6vw,70px) clamp(24px,7vw,78px);
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 text-align:center; box-shadow:0 8px 30px rgba(70,58,45,.05);
}
.kicker{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(30px,5vw,48px);letter-spacing:.03em;font-weight:500;color:#5f554a;margin-top:4px}
.place{font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-top:16px;color:#8a7e6f}
.art{width:min(650px,92%);height:auto;margin:18px 0 8px}
.names{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(40px,7vw,68px);font-weight:500;letter-spacing:.01em;color:#544b41;margin:0}
.date{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(28px,4.5vw,42px);font-weight:500;color:#6b6054;margin-top:4px}
.note{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#978b7b;margin-top:18px}
.rings{width:110px;margin:5px 0 0}
@media(max-width:600px){
 body{padding:12px}
 .card{min-height:calc(100vh - 24px);border-radius:18px;padding:34px 18px}
 .place{letter-spacing:.14em;font-size:9px}
 .art{width:100%;margin:10px 0}
 .note{letter-spacing:.12em;font-size:8px}
}
</style>
</head>
